{% if invite %}<div class="card" role="status" style="border-color:var(--accent)"><b>Send this link to {{ invite.email }}</b>
<p class="muted" style="margin:4px 0 8px">Email isn't set up on this server, so the invite wasn't sent. The link lets them choose their password. It works once and expires in 3 days. Send it privately.</p>
<input type="text" readonly value="{{ invite.link }}" onclick="this.select()" style="width:100%" aria-label="Invite link"></div>{% endif %}
