{% include "core/_auth_head.html" with auth_title="Forgotten password" %}
<body><div class="login"><form class="card" method="post">{% csrf_token %}
<h1 style="margin:0;font-size:20px">Forgotten password</h1>
{% for m in messages %}<div class="flash{% if m.tags == 'error' %} error{% endif %}" role="status">{{ m }}</div>{% endfor %}
<p class="muted" style="margin:0">We'll email a link to choose a new password. It works once and expires in 3 days.</p>
{% include "partials/form.html" %}
<button class="btn primary">Send link</button>
<a href="/login/" class="muted">Back to sign in</a>
</form></div></body></html>
