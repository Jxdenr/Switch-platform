{% for title, fields in sections %}<fieldset class="fs"><legend>{{ title }}</legend>
{% for field in fields %}<div class="field{% if field.widget_type == 'checkbox' %} check{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% for e in field.errors %}<span class="err">{{ e }}</span>{% endfor %}
</div>{% endfor %}</fieldset>{% endfor %}
